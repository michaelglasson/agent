[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
installed = "0.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = "0.39.3"
winreg = "0.56.0"
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.55.0"
tokio = { version = "1.0", features = ["full"] }
dotenvy = "0.15.7"
chrono = "0.4.45"
aws-credential-types = "1.2.14"
rpassword = "7.5.4"
aes-gcm = "0.10.3"

